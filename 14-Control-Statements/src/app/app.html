<h1>If-else |Control flow</h1>

@if(display){
<div style="width: 300px; height: 300px; background-color: azure; border: 1px solid black"></div>
}

<button (click)="toggleDisplay()">{{ display ? 'Hide the Box' : 'Show the Box' }}</button>

<div>Implemeting ElseIF</div>
@if(color==1){
<div style="background-color: red; height: 400px; width: 400px">Box1</div>
} 
@else if(color==2){
<div style="background-color: blue; height: 400px; width: 400px">Box2</div>
}
@else if(color==3){
<div style="background-color: green; height: 400px; width: 400px">Box3</div>
}
@else{
<div style="background-color: black; height: 400px; width: 400px">Box4</div>
}


<button (click)="colorChnageBox(1)">Red</button>
<button (click)="colorChnageBox(3)">Green</button>
<button (click)="colorChnageBox(2)">Blue</button>
<button (click)="colorChnageBox(4)">Black</button>
