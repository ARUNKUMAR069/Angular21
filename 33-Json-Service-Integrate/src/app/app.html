<h1>Integrating the JSON SERVER API with Angular</h1>

@for (user of users(); track user) {
<div>Id : {{ user.id }}</div>
<div>Name : {{ user.name }}</div>
<div>Role: {{ user.role }}</div>
<button (click)="deleteUsers(user.id)">Delete Me</button>
} @empty {
<div>Nothing Available</div>
}


<app-form></app-form>
