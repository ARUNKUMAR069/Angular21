<h1>Event in Angular</h1>

<button (click)="handleEvent($event)">Click Event</button>


<br>
<br>
<button  (mouseenter)="handleEvent($event)">Mouse Enter</button>
<button  (mouseleave)="handleEvent($event)">Mouse Leave</button>


<input type="text"

(input)="inputEvent($event)"
name="user">
