<h1 class="bg-gradient-to-r from-blue-600 to-purple-600 min-w-full text-3xl text-center font-bold py-7 px-4 text-white shadow-lg">Todo List</h1>

<div class="flex flex-col sm:flex-row items-center gap-4 p-4 bg-gray-50 rounded-lg mx-4">
  <input
    class="bg-white border-2 border-gray-300 p-3 rounded-2xl text-black flex-1 max-w-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition-shadow"
    type="text"
    [(ngModel)]="task"
    placeholder="Enter New Task"
  />
  <button (click)="addTask()" class="bg-blue-600 w-50 p-3 rounded-2xl font-black text-white hover:bg-blue-700 transition-colors shadow-md">
    Add Task
  </button>
</div>

<div class="bg-white min-h-100 p-5 flex flex-wrap justify-center items-start gap-4 mx-4 rounded-lg shadow-inner border border-gray-200">
  <div class="flex flex-wrap justify-center items-start gap-4 w-full">
    @for (tasklist of tasklist; track tasklist) {
      <div class="bg-gray-100 w-full sm:w-80 h-auto p-4 rounded-2xl flex flex-col gap-2 shadow-md border border-gray-300 hover:shadow-lg transition-shadow">
        <div class="font-semibold text-gray-800">Task ID: {{ tasklist.id }}</div>
        <div class="text-gray-700">Task: {{ tasklist.task }}</div>
        <!-- Add edit/delete buttons if needed -->
      </div>
    } @empty {
      <div class="bg-gray-100 w-full sm:w-80 h-12 p-3 rounded-2xl text-center text-gray-500 shadow-md">There are no items</div>
    }
  </div>
</div>
